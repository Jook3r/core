name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest that installs, the previous LTS, the recommended one and
        # the newest
        node: [16, 22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3-venv build-essential

      # npm 9.2, Ubuntu's npm package, fails on some forms of "overrides"
      - name: Dependencies resolve with npm 9.2
        if: matrix.node == 22
        run: |
          mkdir "$RUNNER_TEMP/npm92" && cp package.json "$RUNNER_TEMP/npm92/"
          cd "$RUNNER_TEMP/npm92"
          npx -y npm@9.2.0 install --package-lock-only --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Set up Cloud9
        run: scripts/install-sdk.sh

      - name: Server-side tests
        run: scripts/run-tests.sh server

      # Playwright needs Node.js 18+; Claude Code for the panels' chat checks
      - name: Chromium and Claude Code
        if: matrix.node >= 18
        run: |
          test/node_modules/.bin/playwright install --with-deps chromium
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        if: matrix.node >= 18
        run: scripts/run-tests.sh smoke
