# Apache 2.4 (>= 2.4.47, e.g. Ubuntu 24.04/26.04) in front of Cloud9.
#
# Replace ide.example.com with your IDE's hostname, and 8181 with the port
# in cloud9.service if you changed it. Needs:
#   sudo a2enmod proxy proxy_http headers ssl
# Cloud9 checks the login and the Origin of every request itself; Apache
# only terminates TLS and forwards everything, websockets included.

<VirtualHost *:80>
    ServerName ide.example.com
    Redirect permanent / https://ide.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName ide.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ide.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ide.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    # the IDE keeps long-polling and download requests open for a while
    ProxyTimeout 900
    RequestHeader set X-Forwarded-Proto "https"

    # mod_proxy_http tunnels the websocket upgrade itself (no
    # mod_proxy_wstunnel needed). Use 127.0.0.1, not localhost: localhost
    # may resolve to ::1, where Cloud9 is not listening.
    ProxyPass        / http://127.0.0.1:8181/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8181/
</VirtualHost>
