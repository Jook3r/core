# The app you run from the IDE ("Preview Running Application"), served on
# its own hostname. Apps started by the Cloud9 runners listen on
# 127.0.0.1:8080 ($IP:$PORT); set C9_HOSTNAME=app.example.com in
# /etc/cloud9/cloud9.env so the IDE opens this hostname.
#
# Replace app.example.com with your app's hostname. Needs:
#   sudo a2enmod proxy proxy_http headers ssl
# Your app has no login of its own, so Apache asks for one. Create the
# password file with the same username and password as the IDE:
#   sudo htpasswd -B -c /etc/apache2/cloud9-app.htpasswd <username>

<VirtualHost *:80>
    ServerName app.example.com
    Redirect permanent / https://app.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/app.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Location />
        AuthType Basic
        AuthName "Cloud9 app"
        AuthUserFile /etc/apache2/cloud9-app.htpasswd
        Require valid-user
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
